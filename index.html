<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cleverbot</title>
    <!-- Styles -->
    <link rel="stylesheet" href="src/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github.min.css" rel="stylesheet">
    
    <!-- Environment and Scripts -->
    <script src="env.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    
    <!-- Load our modules -->
    <script type="module">
        // Import and initialize modules
        import { API_URL, API_KEY, MODELS } from './src/js/config.js';
        import { api, makeApiRequest, processStream } from './src/js/api.js';
        import { ui } from './src/js/ui.js';
        import { sendMessage, messageHistory } from './src/js/app.js';
        
        // Make them available globally if needed
        window.api = api;
        window.ui = ui;
        window.sendMessage = sendMessage;
    </script>
</head>
<body>
    <header class="header" role="banner">
        <div class="logo" role="heading" aria-level="1">Cleverbot</div>
        <div class="theme-switcher">
            <button class="theme-toggle" aria-label="Toggle theme menu">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <div class="theme-options" role="menu" aria-label="Theme options">
                <button class="theme-option" data-theme="light" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"></circle>
                    </svg>
                    Light
                </button>
                <button class="theme-option" data-theme="dark" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    Dark
                </button>
                <button class="theme-option" data-theme="system" role="menuitem">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    </svg>
                    System
                </button>
            </div>
        </div>
    </header>

    <main role="main">
        <div id="chat-display" role="log" aria-label="Chat messages">
            <div class="message-container" role="list"></div>
        </div>

        <div class="input-section" role="form" aria-label="Message input">
            <div class="input-group">
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="Ask me anything..." 
                    autofocus
                    aria-label="Type your message"
                >
                <button id="send" aria-label="Send message">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span>Send</span>
                </button>
            </div>
        </div>
    </main>

    <template id="model-info-template">
        <div class="model-info">
            <div class="model-name" role="status"></div>
        </div>
    </template>

    <template id="thinking-template">
        <div class="thinking" role="status" aria-live="polite">
            <span>Thinking</span>
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </template>

    <script type="module" src="src/js/theme.js" defer></script>
</body>
</html>
