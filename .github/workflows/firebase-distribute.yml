name: Build and distribute private Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to the tester
        required: true
        type: string

concurrency:
  group: cleverbot-android-release
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: android-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Restore Firebase config (kept out of the repository)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 secret is not set"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLEVERBOT_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cleverbot-release.jks"
      - name: Build signed release APK
        env:
          CLEVERBOT_KEYSTORE_PATH: ${{ runner.temp }}/cleverbot-release.jks
          CLEVERBOT_KEYSTORE_PASSWORD: ${{ secrets.CLEVERBOT_KEYSTORE_PASSWORD }}
          CLEVERBOT_KEY_ALIAS: cleverbot-release
          CLEVERBOT_KEY_PASSWORD: ${{ secrets.CLEVERBOT_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease --no-daemon
      - name: Verify APK signature
        run: jarsigner -verify -strict -certs android/app/build/outputs/apk/release/app-release.apk
      - name: Distribute privately to Firebase tester group
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: >-
          npx --yes firebase-tools appdistribution:distribute
          android/app/build/outputs/apk/release/app-release.apk
          --app "$FIREBASE_APP_ID"
          --groups "owner"
          --release-notes "$RELEASE_NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: cleverbot-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
