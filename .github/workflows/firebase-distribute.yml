name: Build and distribute private Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to the tester
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cleverbot-android-release
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: android-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLEVERBOT_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cleverbot-release.jks"
      - name: Build signed release APK
        env:
          CLEVERBOT_KEYSTORE_PATH: ${{ runner.temp }}/cleverbot-release.jks
          CLEVERBOT_KEYSTORE_PASSWORD: ${{ secrets.CLEVERBOT_KEYSTORE_PASSWORD }}
          CLEVERBOT_KEY_ALIAS: cleverbot-release
          CLEVERBOT_KEY_PASSWORD: ${{ secrets.CLEVERBOT_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease --no-daemon
      - name: Verify APK signature
        run: jarsigner -verify -strict -certs android/app/build/outputs/apk/release/app-release.apk
      - name: Distribute privately to Firebase tester group
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: >-
          npx --yes firebase-tools appdistribution:distribute
          android/app/build/outputs/apk/release/app-release.apk
          --app "$FIREBASE_APP_ID"
          --token "$FIREBASE_TOKEN"
          --groups "owner"
          --release-notes "$RELEASE_NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: cleverbot-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
